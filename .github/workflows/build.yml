name: Build OC A035F Binary9
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu
      - name: Clone Real Kernel A03 UMS9230
        run: |
          git clone --depth=1 https://github.com/DevZillion/android_kernel_samsung_a03s.git kernel
          ls kernel/arch/arm64/boot/dts/ | head
      - name: OC CPU 1.84GHz Binary9 Patch
        run: |
          cd kernel
          # Patch DTS buat OC Scorpio 1843MHz
          find arch/arm64/boot/dts -name "*.dts*" -exec sed -i 's/1690000/1843000/g' {} \; 2>/dev/null || true
          find arch/arm64/boot/dts -name "*.dts*" -exec sed -i 's/1689600/1843200/g' {} \; 2>/dev/null || true
          find . -name "*.dtsi" -exec sed -i 's/1690000/1843000/g' {} \; 2>/dev/null || true
          echo "OC 1.84GHz
